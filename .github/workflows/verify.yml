name: Verify application

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - run: npm run check:edge-types
      - run: npm run check
      - run: npm run check:client-secrets
      - run: npm run check:source-graph
      - run: npx playwright install --with-deps chromium webkit
      - name: Select the installed Chromium for browser fixtures
        run: node --input-type=module -e "import { chromium } from 'playwright'; import { appendFileSync } from 'node:fs'; appendFileSync(process.env.GITHUB_ENV, 'PLANTIE_TEST_BROWSER=' + chromium.executablePath() + '\n');"
      - run: npm run test:image-browser
      - run: npm run test:image-webkit
      - run: npm run test:application-browser
      - run: npm run test:application-webkit
      - run: npm run test:auth-flow-browser
      - run: npm audit --omit=dev

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-ci-only
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:postgres
        env:
          PLANTIE_TEST_POSTGRES_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/postgres
