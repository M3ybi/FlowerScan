name: Verify application

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - run: npm run check:edge-types
      - run: npm run test:auth-signature
      - run: npm run test:revenuecat-mode
      - run: npm run check
      - run: npm run check:client-secrets
      - run: npm run check:source-graph
      - run: npx playwright install --with-deps chromium webkit
      # Ubuntu profiles the system Chrome location for its user-namespace sandbox.
      # A downloaded binary lacks that profile when launched directly by the Auth fixture.
      - name: Select the hosted Chrome for browser fixtures
        run: node --input-type=module -e "import { accessSync, appendFileSync, constants } from 'node:fs'; const browser = process.env.CHROME_BIN; if (!browser) throw new Error('Hosted Chrome is unavailable'); accessSync(browser, constants.X_OK); appendFileSync(process.env.GITHUB_ENV, 'PLANTIE_TEST_BROWSER=' + browser + '\n');"
      - run: npm run test:image-browser
      - run: npm run test:image-webkit
      - run: npm run test:application-browser
      - run: npm run test:application-webkit
      - run: npm run test:menu-entry-browser
      - run: npm run test:menu-entry-webkit
      - run: npm run test:auth-flow-browser
      - run: npm audit --omit=dev

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-ci-only
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:postgres
        env:
          PLANTIE_TEST_POSTGRES_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/postgres
      - run: npm run test:postgres-migrations
        env:
          PLANTIE_TEST_POSTGRES_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/postgres

  supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Creates only a random disposable project, never reads linked credentials.
      # Exit 2 (infrastructure unavailable) fails this gate; it is not a pass.
      - run: npm run test:supabase-local
